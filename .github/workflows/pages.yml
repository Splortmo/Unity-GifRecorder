name: Deploy WebGL demo to GitHub Pages

# Builds the project for WebGL with GameCI and publishes the build to GitHub Pages.
#
# One-time setup:
#   1. Repository secrets (Settings > Secrets and variables > Actions):
#        UNITY_LICENSE  - contents of your Unity_lic.ulf (Personal license)
#        UNITY_EMAIL    - Unity account email
#        UNITY_PASSWORD - Unity account password
#      (Pro/serial licenses use UNITY_SERIAL instead of UNITY_LICENSE, see game.ci docs.)
#   2. Settings > Pages > Build and deployment > Source: "GitHub Actions".

#
# Like release.yml, it only builds when the project version (Player Settings > Version,
# i.e. bundleVersion in ProjectSettings.asset) changes. Run it manually to force a build.

on:
  push:
    branches: [master]
    paths:
      - ProjectSettings/ProjectSettings.asset
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether the project version changed
        id: check
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          read_version() {
            grep -m1 -E '^\s*bundleVersion:' | sed -E 's/^\s*bundleVersion:\s*//' | tr -d '\r[:space:]'
          }
          new=$(read_version < ProjectSettings/ProjectSettings.asset)
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual run - building version $new."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          old=$(git show "$BEFORE:ProjectSettings/ProjectSettings.asset" 2>/dev/null | read_version || true)
          if [ "$old" = "$new" ]; then
            echo "Version unchanged ($new) - skipping deploy."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version changed: '${old:-none}' -> '$new' - deploying."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-

      # GitHub Pages can't send Content-Encoding headers for Unity's precompressed files,
      # so build with gzip + decompression fallback (the loader decompresses in JS).
      # This only changes the CI checkout, not the committed project settings.
      - name: Make WebGL build compatible with GitHub Pages
        run: |
          sed -i -E 's/^(\s*webGLCompressionFormat:).*/\1 1/' ProjectSettings/ProjectSettings.asset
          sed -i -E 's/^(\s*webGLDecompressionFallback:).*/\1 1/' ProjectSettings/ProjectSettings.asset
          grep -E 'webGL(CompressionFormat|DecompressionFallback)' ProjectSettings/ProjectSettings.asset

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildName: WebGL
          allowDirtyBuild: true # the sed step above modifies ProjectSettings.asset

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/WebGL

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
